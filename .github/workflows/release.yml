name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run build

      - name: Upload release files
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gngs-timesheet-setup-*.exe
            dist/gngs-timesheet-setup-*.exe.blockmap
            dist/latest.yml
